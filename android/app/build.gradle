plugins {
    id 'com.android.application'
}

android {
    namespace 'pk.buildcost.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "pk.buildcost.app"
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName "3.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Official Google Test AdMob IDs (can be overridden via gradle.properties or -PADMOB_*)
        def admobAppId = project.findProperty("ADMOB_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713"
        def bannerAdId = project.findProperty("ADMOB_BANNER_ID") ?: "ca-app-pub-3940256099942544/9214589741"
        def interstitialAdId = project.findProperty("ADMOB_INTERSTITIAL_ID") ?: "ca-app-pub-3940256099942544/1033173712"
        def rewardedAdId = project.findProperty("ADMOB_REWARDED_ID") ?: "ca-app-pub-3940256099942544/5224354917"

        resValue "string", "admob_app_id", admobAppId
        buildConfigField "String", "ADMOB_BANNER_ID", "\"${bannerAdId}\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${interstitialAdId}\""
        buildConfigField "String", "ADMOB_REWARDED_ID", "\"${rewardedAdId}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword 'BuildCost2026Secure!'
            keyAlias 'buildcost-key'
            keyPassword 'BuildCost2026Secure!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'com.google.android.play:app-update:2.1.0'
}
